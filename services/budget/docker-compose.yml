services:
  actual_budget:
    container_name: actual_budget
    image: actualbudget/actual-server:26.5.2
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - ${DATA_DIR}/budget:/data
      - ../caddy/combined-ca.crt:/etc/ssl/certs/combined-ca.crt:ro
    env_file: ../../.env
    extra_hosts:
      - "auth.${DOMAIN}:${HOST_IP}"
    environment:
      TZ: ${TIMEZONE}
      ACTUAL_PORT: 5006
      # Trust the internal CA when reaching Authelia over HTTPS (Node app)
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/combined-ca.crt
      # SSO via Authelia OIDC — first login becomes the server owner
      ACTUAL_OPENID_DISCOVERY_URL: https://auth.${DOMAIN}/.well-known/openid-configuration
      ACTUAL_OPENID_CLIENT_ID: budget
      ACTUAL_OPENID_CLIENT_SECRET: ${ACTUAL_OIDC_SECRET}
      ACTUAL_OPENID_SERVER_HOSTNAME: https://budget.${DOMAIN}
      ACTUAL_OPENID_ENFORCE: "true"
    networks:
      - proxy
