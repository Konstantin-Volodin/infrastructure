services:
  gluetun:
    container_name: gluetun
    image: qmcgaw/gluetun:latest
    restart: always
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file: ../../.env
    environment:
      TZ: ${TIMEZONE}
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: openvpn
      OPENVPN_USER: ${PROTONVPN_OPENVPN_USER}
      OPENVPN_PASSWORD: ${PROTONVPN_OPENVPN_PASSWORD}
      SERVER_COUNTRIES: ${VPN_SERVER_COUNTRIES:-Canada}
      FREE_ONLY: ${PROTONVPN_FREE_ONLY:-off}
      VPN_PORT_FORWARDING: on
    networks:
      - proxy

  qbittorrent:
    container_name: qbittorrent
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: always
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    env_file: ../../.env
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TIMEZONE}
      WEBUI_PORT: 8080
    volumes:
      - ${DATA_DIR}/qbittorrent:/config
      - ${DATA_DIR}/downloads:/downloads
      - ${DATA_DIR}/cwa-books-ingest:/cwa-book-ingest

  prowlarr:
    container_name: prowlarr
    image: lscr.io/linuxserver/prowlarr:latest
    restart: always
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    env_file: ../../.env
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TIMEZONE}
      PROWLARR__AUTH__METHOD: External
      PROWLARR__AUTH__REQUIRED: DisabledForLocalAddresses
    volumes:
      - ${DATA_DIR}/prowlarr:/config

  sonarr:
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:latest
    restart: always
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    env_file: ../../.env
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TIMEZONE}
      SONARR__AUTH__METHOD: External
      SONARR__AUTH__REQUIRED: DisabledForLocalAddresses
    volumes:
      - ${DATA_DIR}/sonarr:/config
      - ${DATA_DIR}:/data

  radarr:
    container_name: radarr
    image: lscr.io/linuxserver/radarr:latest
    restart: always
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    env_file: ../../.env
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TIMEZONE}
      RADARR__AUTH__METHOD: External
      RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
    volumes:
      - ${DATA_DIR}/radarr:/config
      - ${DATA_DIR}:/data
