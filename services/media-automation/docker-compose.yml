services:
  gluetun:
    container_name: gluetun
    image: qmcgaw/gluetun:latest
    restart: always
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: ${TIMEZONE}
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: openvpn
      OPENVPN_USER: ${PROTONVPN_OPENVPN_USER}
      OPENVPN_PASSWORD: ${PROTONVPN_OPENVPN_PASSWORD}
      SERVER_COUNTRIES: ${VPN_SERVER_COUNTRIES:-Canada}
      FREE_ONLY: ${PROTONVPN_FREE_ONLY:-off}
      VPN_PORT_FORWARDING: on
      VPN_PORT_FORWARDING_UP_COMMAND: >-
        /bin/sh -c 'wget -O- -nv --retry-connrefused
        --post-data "json={\"listen_port\":{{PORT}},\"random_port\":false,\"upnp\":false}"
        http://127.0.0.1:8080/api/v2/app/setPreferences'
      VPN_PORT_FORWARDING_DOWN_COMMAND: >-
        /bin/sh -c 'wget -O- -nv --retry-connrefused
        --post-data "json={\"listen_port\":0}"
        http://127.0.0.1:8080/api/v2/app/setPreferences'
    networks:
      - proxy

  qbittorrent:
    container_name: qbittorrent
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: always
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TIMEZONE}
      WEBUI_PORT: 8080
      # VueTorrent — modern WebUI, installed via LSIO docker-mod
      # https://github.com/gabe565/linuxserver-mod-vuetorrent
      DOCKER_MODS: ghcr.io/gabe565/linuxserver-mod-vuetorrent
    volumes:
      - ${CONFIG_DIR}/qbittorrent:/config
      # one mount: downloads and library must share a filesystem for hardlinks
      - ${MEDIA_DIR}:/data

  prowlarr:
    container_name: prowlarr
    image: lscr.io/linuxserver/prowlarr:latest
    restart: always
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TIMEZONE}
      PROWLARR__AUTH__METHOD: External
      PROWLARR__AUTH__REQUIRED: DisabledForLocalAddresses
    volumes:
      - ${CONFIG_DIR}/prowlarr:/config

  sonarr:
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:latest
    restart: always
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TIMEZONE}
      SONARR__AUTH__METHOD: External
      SONARR__AUTH__REQUIRED: DisabledForLocalAddresses
    volumes:
      - ${CONFIG_DIR}/sonarr:/config
      - ${MEDIA_DIR}:/data

  radarr:
    container_name: radarr
    image: lscr.io/linuxserver/radarr:latest
    restart: always
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TIMEZONE}
      RADARR__AUTH__METHOD: External
      RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
    volumes:
      - ${CONFIG_DIR}/radarr:/config
      - ${MEDIA_DIR}:/data

  # Sonarr and Radarr import by hardlink, so deleting from their UI drops one
  # name and qBittorrent keeps seeding the other. This tags those torrents noHL
  # and removes them once they have finished seeding — see qbit-manage.yml.
  qbit-manage:
    container_name: qbit-manage
    image: ghcr.io/stuffanthings/qbit_manage:latest
    restart: always
    # gluetun's namespace: qBittorrent is on localhost, so its local-address
    # auth bypass applies and no API credentials are needed.
    network_mode: "service:gluetun"
    depends_on:
      - qbittorrent
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TIMEZONE}
      # which commands run is in qbit-manage.yml; this is just the cadence
      QBT_SCHEDULE: ${REAP_INTERVAL_MINUTES:-60}
      QBT_STARTUP_DELAY: 120
      QBT_WEB_SERVER: false
      QBT_DRY_RUN: ${REAP_DRY_RUN:-true}
    volumes:
      - ./qbit-manage.yml:/config/config.yml:ro
      - ${CONFIG_DIR}/qbit-manage:/config/logs
      # the same mount qBittorrent has, so paths and link counts agree
      - ${MEDIA_DIR}:/data
