services:
  mealie:
    container_name: mealie
    image: ghcr.io/mealie-recipes/mealie:v3.12.0
    restart: always
    deploy:
      resources:
        limits:
          memory: 1000M
    volumes:
      - ${DATA_DIR}/mealie:/app/data/
      - ../caddy/combined-ca.crt:/etc/ssl/certs/combined-ca.crt:ro
    extra_hosts:
      - "auth.${DOMAIN}:${HOST_IP}"
    environment:
      ALLOW_SIGNUP: "false"
      PUID: 1000
      PGID: 1000
      TZ: ${TIMEZONE}
      DATA_DIR: /app/data/
      THEME_LIGHT_PRIMARY: '#22D3EE'
      THEME_LIGHT_ACCENT: '#22D3EE'
      THEME_LIGHT_SECONDARY: '#64748B'
      THEME_DARK_PRIMARY: '#22D3EE'
      THEME_DARK_ACCENT: '#22D3EE'
      THEME_DARK_SECONDARY: '#121627'
      SSL_CERT_FILE: /etc/ssl/certs/combined-ca.crt
      BASE_URL: https://recipes.${DOMAIN}
      OIDC_AUTH_ENABLED: "true"
      OIDC_SIGNUP_ENABLED: "true"
      OIDC_CONFIGURATION_URL: https://auth.${DOMAIN}/.well-known/openid-configuration
      OIDC_CLIENT_ID: mealie
      OIDC_CLIENT_SECRET: ${MEALIE_OIDC_SECRET}
      OIDC_PROVIDER_NAME: Authelia
      OIDC_REMEMBER_ME: "true"
      OIDC_AUTO_REDIRECT: "false"
    networks:
      - proxy
