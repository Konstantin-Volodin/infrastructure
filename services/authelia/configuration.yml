server:
  address: 'tcp://:9091'

theme: 'dark'

log:
  level: 'debug'
  format: json
  file_path: '/data/log/authelia.log'
  keep_stdout: true

totp: # Time-based One-Time Password
  issuer: '{{ env "DOMAIN" }}' # Might need to be authelia.com
  period: 30
  digits: 6
  algorithm: 'sha1'
  skew: 1

authentication_backend:
  file:
    path: '/data/users_database.yml'
    password:
      algorithm: 'argon2id'
      iterations: 3
      key_length: 32
      salt_length: 16
      parallelism: 4
      memory: 256

password_policy:
  standard:
    enabled: true
    min_length: 30

access_control:
  default_policy: 'deny'
  rules:
    - domain: 
      - 'auth.{{ env "DOMAIN" }}'
      policy: 'bypass'
    - domain:
      - '{{ env "DOMAIN"}}'
      - '*.{{ env "DOMAIN" }}'
      policy: 'one_factor'

session:
  name: 'authelia_session'
  # This is a LAN service reached over Tailscale, not something on the open
  # internet, so the timeouts are tuned for not being nagged. 0 inactivity
  # means an idle tab stays logged in; tick "remember me" and a browser is
  # good for three months.
  expiration: '1w'
  inactivity: '0'
  remember_me: '3M'
  # secret: '{{ env "AUTHELIA_SESSION_SECRET" }}'
  # Sessions live in Redis, not in memory — otherwise every `just restart`
  # (nightly, via the update cron) logs everyone out of everything.
  redis:
    host: 'authelia-redis'
    port: 6379
  cookies:
    - domain: '{{ env "DOMAIN" }}'
      authelia_url: 'https://auth.{{ env "DOMAIN" }}'
      same_site: 'lax'

regulation:
  max_retries: 3
  find_time: '2m'
  ban_time: '30m'

storage:
  # encryption_key: '{{ env "AUTHELIA_STORAGE_ENCRYPTION_KEY" }}'
  local:
    path: '/data/db.sqlite3'

notifier:
  filesystem:
    filename: '/data/notification.txt'

identity_providers:
  oidc:
    hmac_secret: '{{ env "AUTHELIA_OIDC_HMAC_SECRET" }}'
    jwks:
      - key: {{ secret "/data/secrets/oidc.jwks.key" | mindent 10 "|" | msquote }}
    clients:
      - client_id: 'immich'
        client_name: 'Immich'
        client_secret: '{{ env "IMMICH_OIDC_SECRET" }}'
        authorization_policy: 'one_factor'
        token_endpoint_auth_method: 'client_secret_post'
        consent_mode: 'implicit'
        redirect_uris:
          - 'https://photos.{{ env "DOMAIN" }}/auth/login'
          - 'https://my.immich.app/oauth-callback'
          - 'app.immich:///oauth-callback'
          - 'app.immich:/'
        scopes:
          - 'openid'
          - 'email'
          - 'profile'
        userinfo_signed_response_alg: 'none'

      - client_id: 'mealie'
        client_name: 'Mealie'
        client_secret: '{{ env "MEALIE_OIDC_SECRET" }}'
        authorization_policy: 'one_factor'
        token_endpoint_auth_method: 'client_secret_basic'
        consent_mode: 'implicit'
        redirect_uris:
          - 'https://recipes.{{ env "DOMAIN" }}/login'
        scopes:
          - 'openid'
          - 'email'
          - 'profile'
        userinfo_signed_response_alg: 'none'

      - client_id: 'budget'
        client_name: 'Actual Budget'
        client_secret: '{{ env "ACTUAL_OIDC_SECRET" }}'
        authorization_policy: 'one_factor'
        token_endpoint_auth_method: 'client_secret_basic'
        consent_mode: 'implicit'
        redirect_uris:
          - 'https://budget.{{ env "DOMAIN" }}/openid/callback'
        scopes:
          - 'openid'
          - 'email'
          - 'profile'
        userinfo_signed_response_alg: 'none'